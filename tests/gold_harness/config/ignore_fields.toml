# Frozen list of gold-only derived/verbatim fields the differ skips.
# Do not edit during the fix loop.

[global]
ignore = [
    # Gold bookkeeping / section metadata
    "index",
    "type",
    "size",
    "bitsize",
    "_subclass",
    "preview_exists",
    "preview_size",
    "preview",
    "preview_is_proxy",
    # Numeric entmode is gold-specific; silver keeps entity_mode under _common_dwg
    "entmode",
    # Counters / internal lists
    "num_*",
    "opts_r11",
    "flag_r11",
    "extra_r11",
    # EED reactors ordering handled separately
    "eed",
    # Silver internal / raw / verbatim object fields that are not semantic structure
    "raw_data",
    "raw_dwg_data",
    "raw_dwg_handle_bits",
    "raw_dxf_codes",
    "preserve_object_reference_stream",
    "entries_complete",
    "object_references",
    "xdata",
    "xdata_size",
    # Dictionary internals that differ in representation
    "items",
    "entries",
    "hard_owner_entries",
    "is_hardowner",
    "hard_owner",
    "cloning",
    "duplicate_cloning",
    "numitems",
]

[by_type]
# Per-type overrides can be added here if a field is intentionally non-comparable
# for only one entity/object type.
