name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check all targets and features
        run: cargo check --all-targets --all-features
      - name: Test typed storage contract
        run: cargo test --features typed-storage --test 'typed_storage_*'
      - name: Test private storage projection and transport
        run: cargo test --features typed-storage --lib storage::
      - name: Test default features
        run: cargo test
      - name: Test all features
        run: cargo test --all-features

  wasm:
    name: Check WebAssembly
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - name: Check default features
        run: cargo check --lib --target wasm32-unknown-unknown
      - name: Check all features
        run: cargo check --lib --all-features --target wasm32-unknown-unknown
